<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Comptoir</title>
<meta name="description" content="Vos commandes en ligne, sous contrôle. Cadeaux tech livrés partout à Dakar.">
<meta property="og:title" content="Comptoir">
<meta property="og:description" content="Cadeaux tech pour petits et grands, livrés partout à Dakar. Commandez en ligne.">
<meta property="og:image" content="https://comptoir-sn.github.io/icon-512.png">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comptoir">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%2314213D'/%3E%3Cg transform='translate(24 24) scale(.74) translate(-24 -23)'%3E%3Cpath d='M33.81 30.39A11.5 11.5 0 1 1 33.81 15.61' fill='none' stroke='%23fff' stroke-width='7.2' stroke-linecap='round'/%3E%3Cpath d='M15.2 29.5L11.6 41.2L21.8 34.6Z' fill='%23fff' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='24.6' cy='23' r='4.7' fill='%23FF7A1A'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..900&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte officielle Comptoir v1 (nov. 2026) : Encre 60 %, Sable 30 %, Safran 10 % */
  --ink:#14213D; --ink-2:#5B6478; --ink-3:#8A90A0;
  --bg:#FFFFFF; --surface:#FFFFFF; --line:#E8E2D8; --soft:#F7F1E8; --sable:#F7F1E8;
  --safran:#FF7A1A; --safran-2:#EE6A0B; --safran-soft:#FFF0E3;
  --indigo:#14213D; --indigo-2:#0D1730; --indigo-soft:#F7F1E8;
  --mango:#FF7A1A; --mango-soft:#FFF0E3; --mango-ink:#B4530A;
  --amber:#F5A524; --amber-soft:#FEF4E2; --amber-ink:#A86A07;
  --blue:#2F6FEB; --blue-soft:#E7EEFD;
  --bissap:#7C5CE6; --bissap-soft:#EFEBFC;
  --baobab:#1FA971; --baobab-soft:#E3F5EC;
  --red:#E5484D; --red-soft:#FDE9EA;
  --grey:#8A90A0; --grey-soft:#F1F2F4;
  --r-lg:12px; --r-md:12px; --r-sm:10px;
  --shadow:0 1px 2px rgba(20,33,61,.05);
  --wax:linear-gradient(transparent,transparent);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;font-optical-sizing:auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
main{padding:12px 16px 150px;max-width:1040px;width:100%;min-width:0;margin:0 auto}

/* ---------- Logo ---------- */
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.035em;color:var(--ink);text-decoration:none}
.logo svg{flex:none}
.logo .word{font-size:1.32rem;line-height:1}
.logo.light{color:#fff}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 16px}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn svg{width:20px;height:20px}
.pagehead{margin:0 0 14px}
.pagehead .shop{font-size:.92rem;color:var(--ink-2);font-weight:600}
.pagehead h1{margin:2px 0 0;font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.02;letter-spacing:-.03em;font-weight:800;font-variation-settings:"opsz" 96}
.pagehead .sub{color:var(--ink-2);margin-top:4px}
.demo{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px dashed #CFC8E6;color:var(--ink-2);font-size:.82rem;padding:7px 12px;border-radius:999px;margin-bottom:12px;width:max-content;max-width:100%}
.demo i{width:7px;height:7px;border-radius:50%;background:var(--mango);flex:none}

/* ---------- Tab bar ---------- */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(22,19,46,.96);backdrop-filter:blur(10px);border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 6px;z-index:10;box-shadow:0 18px 40px -16px rgba(22,19,46,.6)}
.tab{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;color:#A8A5C2;padding:6px 0;cursor:pointer;border-radius:14px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:#fff;font-weight:700}
.tab[aria-current="page"]::after{content:"";position:absolute;bottom:-3px;width:16px;height:3px;border-radius:3px;background:var(--mango)}
.tab.plus{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--mango);color:var(--ink);margin-top:-26px;box-shadow:0 10px 24px -8px rgba(255,176,32,.9);display:grid;place-items:center;padding:0}
.tab.plus svg{width:26px;height:26px}
.tab.plus span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:1.05rem;letter-spacing:-.01em}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 16px;color:#fff;background:var(--wax),linear-gradient(135deg,#4330D9 0%,#6236DE 52%,#D9346B 120%);box-shadow:0 22px 44px -22px rgba(67,48,217,.75)}
.hero .label{font-size:.92rem;opacity:.85;font-weight:600}
.hero .big{font-size:clamp(2.4rem,9vw,3.2rem);font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 14px}
.hero .chipsrow{display:flex;gap:8px;flex-wrap:wrap}
.hero .mchip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 11px;font-size:.84rem;white-space:nowrap}
.hero .mchip b{margin-left:4px}
.hero .blob{position:absolute;right:-44px;top:-44px;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE08A,#FFB020 60%,#E79300);opacity:.95;box-shadow:inset -10px -12px 0 rgba(0,0,0,.08)}
.hero .blob::after{content:"F";position:absolute;left:34px;top:56px;font-weight:800;font-size:2.4rem;color:rgba(122,78,0,.55)}
.hero > *{position:relative}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.kpi{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.kpi .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.kpi .ic svg{width:18px;height:18px}
.kpi b{font-size:1.6rem;line-height:1;font-weight:800;letter-spacing:-.03em}
.kpi span{font-size:.8rem;color:var(--ink-2);line-height:1.2}
.cash{background:var(--wax),var(--ink);color:#fff;border-color:var(--ink)}
.cash .muted{color:#B9B6D3}
.cash .big{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.coinstack{display:flex;align-items:center;gap:10px}
.coin{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE08A,#FFB020 60%,#D98A00);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 4px 10px -4px rgba(0,0,0,.5);display:grid;place-items:center;font-weight:800;color:#7A4E00;font-size:.9rem;flex:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.cash .row{border-color:rgba(255,255,255,.1)}
.muted{color:var(--ink-2);font-size:.9rem}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none;color:#fff}
.road{position:relative;height:96px;border-radius:16px;overflow:hidden;background:linear-gradient(#EAE6F8,#EAE6F8) 0 70px/100% 26px no-repeat,linear-gradient(180deg,#F6F4FB,#EFECF8)}
.road::after{content:"";position:absolute;left:0;right:0;top:82px;height:3px;background:repeating-linear-gradient(90deg,#fff 0 18px,transparent 18px 36px);animation:dash 1s linear infinite}
@keyframes dash{to{background-position:-36px 0}}
.road .moto{position:absolute;left:0;top:14px;width:104px;height:66px;animation:ride 6s linear infinite}
@keyframes ride{0%{transform:translateX(-120px)}100%{transform:translateX(calc(100vw))}}
.road .moto .bob{animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-1.5px)}}
.road .wheel{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.road .city{position:absolute;left:0;right:0;top:20px;height:50px;opacity:.5;width:100%}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.todo li:first-child{border-top:0}
.todo .tic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.todo .tic svg{width:18px;height:18px}
.todo button{margin-left:auto;flex:none}

/* ---------- Buttons ---------- */
.btn{appearance:none;border:1px solid transparent;background:var(--indigo);color:#fff;font-weight:700;padding:12px 16px;border-radius:14px;cursor:pointer;font-size:.97rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .12s ease,background .15s}
.btn:hover{background:var(--indigo-2)}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.mango{background:var(--mango);color:var(--ink)}
.btn.mango:hover{background:#F5A30D}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.soft{background:var(--indigo-soft);color:var(--indigo)}
.btn.soft:hover{background:#DFDAFB}
.btn.danger{background:var(--surface);color:var(--red);border-color:#F3C9BD}
.btn.wa{background:var(--baobab)}
.btn.wa:hover{background:#188558}
.btn.small{padding:7px 11px;font-size:.85rem;border-radius:11px}
.btn.block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}

/* ---------- Orders ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:.88rem;white-space:nowrap;cursor:pointer;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px;margin-bottom:12px}
.search svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.search input{border:0;outline:0;background:none;padding:12px 0;width:100%}
.olist{display:grid;gap:10px}
.order{appearance:none;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;box-shadow:var(--shadow);transition:transform .12s}
.order:hover{transform:translateY(-1px)}
.order .av{grid-row:span 3}
.order .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order .meta{color:var(--ink-2);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order .amt{font-weight:800;text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-nouvelle{background:var(--mango-soft);color:var(--mango-ink)}
.s-confirmee{background:var(--indigo-soft);color:var(--indigo)}
.s-livraison{background:var(--bissap-soft);color:var(--bissap)}
.s-livree{background:var(--baobab-soft);color:var(--baobab)}
.s-refusee{background:var(--red-soft);color:var(--red)}
.s-annulee{background:var(--grey-soft);color:var(--grey)}

/* ---------- Banner photo ---------- */
.banner{position:relative;border-radius:24px;overflow:hidden;min-height:150px;color:#fff;display:flex;align-items:flex-end;padding:16px;margin-bottom:12px;background:var(--wax),linear-gradient(135deg,#4330D9,#D9346B)}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,19,46,.05) 0%,rgba(22,19,46,.82) 100%),linear-gradient(135deg,rgba(67,48,217,.35),rgba(217,52,107,.15))}
.banner > div{position:relative;z-index:1}
.banner h2{margin:0;font-size:1.35rem;letter-spacing:-.02em}
.banner p{margin:2px 0 0;opacity:.85;font-size:.92rem}
img.broken{display:none}

/* ---------- Drivers ---------- */
.dcard{display:grid;gap:10px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dname{font-weight:800;font-size:1.08rem;letter-spacing:-.01em}
.money{font-weight:800;font-size:1.45rem;letter-spacing:-.02em}
.money.zero{color:var(--ink-3)}

/* ---------- Products ---------- */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.pimg{position:relative;aspect-ratio:4/3;background:var(--wax),linear-gradient(135deg,#6236DE,#D9346B);display:grid;place-items:center}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pimg .ph{font-weight:800;font-size:2.4rem;color:#fff;opacity:.7}
.pimg .tag{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px}
.pimg .cam{position:absolute;right:8px;bottom:8px;background:rgba(22,19,46,.72);color:#fff;border:0;border-radius:10px;padding:6px 9px;font-size:.75rem;cursor:pointer;display:flex;gap:5px;align-items:center}
.pimg .cam svg{width:14px;height:14px}
.pbody{padding:10px 12px 12px;display:grid;gap:8px;flex:1}
.pname{font-weight:700;line-height:1.2;font-size:.95rem}
.pprice{font-weight:800;color:var(--indigo)}
.stock{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:4px}
.stock button{width:32px;height:32px;border-radius:9px;border:0;background:var(--surface);cursor:pointer;font-size:1.1rem;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stock b{font-size:1rem}
.stock small{color:var(--ink-2);font-size:.75rem}

/* ---------- Forms ---------- */
label{display:block;font-size:.84rem;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field{margin-bottom:12px}
input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:1rem}
input:focus,select:focus,textarea:focus{outline:2px solid var(--indigo);outline-offset:0;border-color:transparent}
textarea{min-height:96px;resize:vertical}
.found{border-color:var(--baobab) !important;background:#F3FBF7 !important;box-shadow:0 0 0 3px rgba(31,157,106,.15)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.itemrow{display:grid;grid-template-columns:minmax(0,1fr) 76px 44px;gap:8px;margin-bottom:8px;align-items:center}
.itemrow button{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.totals{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin:6px 0 14px}
.totals .row:first-child{border-top:0}
.totals .grand{font-weight:800;font-size:1.1rem}
.paste{position:relative;overflow:hidden;background:var(--wax),linear-gradient(135deg,#4330D9,#6236DE);color:#fff;border-radius:22px;padding:14px;margin-bottom:16px}
.paste label{color:#fff;font-size:.95rem}
.paste textarea{border:0;background:rgba(255,255,255,.96);color:var(--ink)}
.paste .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.parsed{font-size:.86rem;margin-top:8px;min-height:1.2em;color:#E9E5FF}
.warn{color:var(--red);font-size:.86rem;margin:-4px 0 10px}

/* ---------- Sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,19,46,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;z-index:31;transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.2,1),visibility 0s linear .32s;padding:0 16px calc(22px + env(safe-area-inset-bottom))}
.sheet.show{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.2,1),visibility 0s}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:#D6D1E8;margin:8px auto 0}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:10px 0;z-index:2}
.sheet-head h2{margin:0;font-size:1.3rem;letter-spacing:-.02em}
.x{appearance:none;border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:13px;cursor:pointer;font-size:1.05rem}
.actions{display:grid;gap:8px;margin-top:12px}
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 14px}
.steps div{display:grid;gap:6px;font-size:.72rem;color:var(--ink-3);font-weight:600}
.steps div::before{content:"";height:6px;border-radius:6px;background:var(--line)}
.steps div.on{color:var(--ink)}
.steps div.on::before{background:var(--indigo)}
.steps.ok div.on::before{background:var(--baobab)}
.steps.ko div.on.end::before{background:var(--red)}
.timeline{list-style:none;padding:0;margin:0;font-size:.88rem;color:var(--ink-2)}
.timeline li{padding:6px 0 6px 18px;position:relative}
.timeline li::before{content:"";position:absolute;left:3px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--indigo)}
.donecheck{display:flex;align-items:center;gap:10px;background:var(--baobab-soft);color:var(--baobab);border-radius:16px;padding:12px;font-weight:700}
.donecheck svg{width:30px;height:30px;flex:none}
.donecheck path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- Toast & FX ---------- */
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:.92rem;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 12px 30px -10px rgba(22,19,46,.6)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.fx .conf{position:absolute;top:45%;left:50%;width:9px;height:13px;border-radius:2px;background:var(--c);animation:conf 1.15s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes conf{0%{transform:translate(-50%,-50%) scale(.6)}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1);opacity:0}}
.fx .fcoin{position:absolute;top:-40px;left:var(--l);width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE08A,#FFB020 60%,#D98A00);box-shadow:inset 0 0 0 3px rgba(255,255,255,.4);animation:fall 1.2s cubic-bezier(.45,0,.8,.6) var(--d) forwards}
@keyframes fall{to{transform:translateY(75vh) rotate(260deg);opacity:0}}

/* ---------- Welcome ---------- */
.welcome{position:fixed;inset:0;z-index:70;background:var(--ink);color:#fff;overflow-y:auto;display:none}
.welcome.show{display:block}
.w-photo{position:relative;height:56vh;min-height:330px;overflow:hidden;background:var(--wax),linear-gradient(135deg,#4330D9,#D9346B)}
.w-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.w-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,19,46,.15) 0%,rgba(22,19,46,.1) 45%,var(--ink) 100%),linear-gradient(135deg,rgba(67,48,217,.45),rgba(217,52,107,.2))}
.w-top{position:absolute;left:20px;right:20px;top:calc(18px + env(safe-area-inset-top));z-index:2;display:flex;justify-content:space-between;align-items:center}
.bubbles{position:absolute;right:16px;bottom:56px;z-index:2;display:grid;gap:8px;justify-items:end;width:min(78%,300px)}
.bub{background:#fff;color:var(--ink);border-radius:18px 18px 4px 18px;padding:9px 13px;font-size:.92rem;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);opacity:0;transform:translateY(10px) scale(.96);animation:pop 7.5s ease infinite}
.bub.b2{animation-delay:.9s}
.bub.b3{animation-delay:1.8s;background:var(--mango);font-weight:700}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.96)}6%{opacity:1;transform:none}80%{opacity:1;transform:none}90%,100%{opacity:0;transform:translateY(-6px)}}
.w-body{padding:0 22px 40px;max-width:560px;margin:-40px auto 0;position:relative;z-index:2}
.w-body h1{font-size:clamp(2.3rem,9vw,3.4rem);line-height:.98;letter-spacing:-.045em;margin:0 0 12px;font-weight:800;font-variation-settings:"opsz" 96}
.w-body h1 em{font-style:normal;color:var(--mango)}
.w-body p.lead{color:#C9C6E0;font-size:1.05rem;margin:0 0 18px;max-width:40ch}
.w-feats{display:grid;gap:10px;margin:0 0 22px;padding:0;list-style:none}
.w-feats li{display:flex;gap:12px;align-items:center;color:#E9E7F5}
.w-feats .tic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.w-feats svg{width:18px;height:18px}
.w-cta{display:grid;gap:10px}
.w-credit{margin-top:18px;font-size:.75rem;color:#8D8AA5}


/* ---------- Boutique en ligne : vendeuse ---------- */
.topactions{display:flex;gap:8px}
.bell{position:relative}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--bissap);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg);line-height:1}
.tab .badge{top:0;right:calc(50% - 24px);border-color:var(--ink)}
.side .tab .badge{position:static;margin-left:auto;border-color:var(--ink)}
.notif{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:65;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 22px 44px -14px rgba(22,19,46,.5);padding:12px 12px 12px 14px;display:flex;gap:12px;align-items:center;transform:translateY(-150%);transition:transform .38s cubic-bezier(.2,.9,.2,1)}
.notif.show{transform:none}
.notif .ico{width:44px;height:44px;border-radius:14px;background:var(--mango);color:var(--ink);display:grid;place-items:center;flex:none;animation:ring 1s ease 2}
.notif .ico svg{width:22px;height:22px}
.notif b{display:block;letter-spacing:-.01em}
.notif .muted{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.p-paye{background:var(--baobab-soft);color:var(--baobab)}
.p-verif{background:var(--mango-soft);color:var(--mango-ink)}
.p-attente{background:var(--grey-soft);color:var(--grey)}
.p-cod{background:var(--soft);color:var(--ink-2)}
.src{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--indigo);background:var(--indigo-soft);padding:4px 8px;border-radius:999px}
.src svg{width:12px;height:12px}
.order .tags{grid-column:2 / 4;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

.order.unread{border-color:#CFC6FA;background:linear-gradient(90deg,#F4F1FF,#fff 60%)}

.linkbox{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.88rem;color:var(--ink-2)}
.linkbox svg{width:16px;height:16px;flex:none;color:var(--indigo)}
.linkbox span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.shopcard{background:var(--wax),linear-gradient(160deg,#FFF6E3,#fff 55%);border-color:#F5E2B8}
.payinfo{background:var(--mango-soft);border-radius:16px;padding:14px;margin:12px 0}
.check{display:flex;gap:10px;align-items:center;color:var(--ink);font-weight:600;font-size:.95rem;margin:0}

.cartbar .btn{width:100%;justify-content:space-between;padding:16px 18px;border-radius:18px;font-size:1rem;box-shadow:0 16px 30px -12px rgba(67,48,217,.7)}
.sf-foot{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--ink-3);font-size:.82rem;padding:24px}
.sf-foot .logo .word{font-size:1rem}
.radio{display:grid;gap:8px}
.radio label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:13px;font-weight:600;color:var(--ink);cursor:pointer;margin:0;background:#fff;font-size:.95rem}
.radio input{accent-color:var(--indigo);width:18px;height:18px}
.radio label:has(input:checked){border-color:var(--indigo);background:var(--indigo-soft)}
.bigcheck{width:84px;height:84px;margin:6px auto 10px;display:block}
.bigcheck path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .2s ease forwards}
@media (min-width:700px){ .sf-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
/* ---------- Desktop ---------- */
@media (min-width:900px){
  .app{grid-template-columns:250px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--ink);color:#fff}
  .side .logo{margin:0 8px 22px}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:.98rem;padding:11px 12px;color:#B9B6D3}
  .side .tab[aria-current="page"]{background:rgba(255,255,255,.08);color:#fff}
  .side .tab[aria-current="page"]::after{left:0;top:50%;bottom:auto;width:3px;height:18px;transform:translateY(-50%)}
  .side .newbtn{margin-top:16px}
  .side .shopname{margin-top:auto;font-size:.85rem;color:#8D8AA5;padding:0 12px}
  .tabs{display:none}
  .topbar > .logo{visibility:hidden}
  .topbar{margin-bottom:6px}
  main{padding:28px 32px 60px}
  .sheet{left:auto;top:0;bottom:0;width:min(540px,100%);max-height:none;border-radius:26px 0 0 26px;transform:translateX(105%)}
  .sheet.show{transform:none}
  .sheet::before{display:none}
  .dash{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start}
  .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .toast{bottom:28px}
  .welcome.show{display:grid;grid-template-columns:1.1fr 1fr}
  .w-photo{height:100vh}
  .w-body{margin:0;align-self:center;padding:40px 48px}
  .bubbles{bottom:40px}
}
@media (max-width:899px){ .dash > .grid + .grid{margin-top:12px} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.bub{opacity:1;transform:none}}
